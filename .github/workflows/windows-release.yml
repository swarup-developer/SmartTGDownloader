name: Build and Release Windows App

on:
  push:
    branches:
      - windows

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv package manager
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          echo "$HOME\.local\bin" >> $GITHUB_PATH
        shell: bash

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "import re; content = open('windows_desktop/smarttgdownloader/utils.py', 'r', encoding='utf-8').read(); print(re.search(r'CURRENT_VERSION\s*=\s*\"([^\"]+)\"', content).group(1))")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Windows executable
        run: |
          cd windows_desktop
          .\build.bat
        shell: cmd

      - name: Extract Release Notes
        shell: bash
        run: |
          python .github/workflows/extract_changelog.py ${{ env.VERSION }}

      - name: Create and Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-windows
          name: SmartTG Downloader Windows v${{ env.VERSION }}
          body_path: release_notes.txt
          files: windows_desktop/dist/SmartTGDownloader.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
