name: Build and Release Android App

on:
  push:
    branches:
      - android

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse app version
        id: parse_version
        run: |
          VERSION=$(grep 'version: ' android_flutter/pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION | cut -d'+' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Generate version.dart
        run: |
          echo 'const String appVersionName = "${{ env.VERSION_NAME }}";' > android_flutter/lib/version.dart
          echo 'const int appVersionCode = ${{ env.VERSION_CODE }};' >> android_flutter/lib/version.dart

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd android_flutter
          flutter pub get

      - name: Build Android App Bundle (AAB)
        run: |
          cd android_flutter
          flutter build appbundle --release

      - name: Build Split APKs (per ABI)
        run: |
          cd android_flutter
          flutter build apk --release --split-per-abi

      - name: Create and Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-android
          name: SmartTG Downloader Android v${{ env.VERSION_NAME }}
          body: |
            ## SmartTG Downloader Android Release v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
            
            This is an automated release of the Android client.
            
            ### Architecture-Specific Builds
            Choose the build matching your device's architecture for the smallest download size:
            - **ARM64 (64-bit phones)**: `app-arm64-v8a-release.apk`
            - **ARMv7 (32-bit older phones)**: `app-armeabi-v7a-release.apk`
            - **x86_64 (Emulators/tablets)**: `app-x86_64-release.apk`
            
            *Alternatively, the Google Play version automatically serves the optimized build from the `app-release.aab` bundle.*
          files: |
            android_flutter/build/app/outputs/bundle/release/app-release.aab
            android_flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            android_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            android_flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
