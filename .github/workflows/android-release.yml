name: Build and Release Android App

on:
  push:
    branches:
      - android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Expose Telegram API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::warning::TG_API_ID/TG_API_HASH secrets are not set; the build will fail with guidance."
          fi
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<EOF
          TG_API_ID=$TG_API_ID
          TG_API_HASH=$TG_API_HASH
          EOF

      - name: Configure release signing from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets are not fully set; the release APK will be UNSIGNED and not installable."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > android/keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Signing config written (alias: $ANDROID_KEY_ALIAS)."

      - name: Parse app version
        id: parse_version
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle.kts | sed 's/.*versionName = "\(.*\)"/\1/')
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle.kts | sed 's/.*versionCode = \(.*\)/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Build ARM release APKs
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            -PabiFilters=armeabi-v7a,arm64-v8a

      - name: Verify APK signing
        working-directory: android
        run: |
          ls -la app/build/outputs/apk/release/
          if [ -f keystore.properties ]; then
            if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
              echo "::error::Signing config was present but APKs are unsigned."
              exit 1
            fi
            echo "APKs are signed."
          else
            echo "::warning::No signing config; APKs are UNSIGNED (not installable on devices)."
          fi

      - name: Extract Release Notes
        run: |
          python .github/workflows/extract_changelog.py ${{ env.VERSION_NAME }}

      - name: Rename release APK with version
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/SmartTGDownloader-v${{ env.VERSION_NAME }}.apk"

      - name: Create and Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-android
          name: SmartTG Downloader Android v${{ env.VERSION_NAME }}
          body_path: release_notes.txt
          files: |
            android/app/build/outputs/apk/release/SmartTGDownloader-v${{ env.VERSION_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
