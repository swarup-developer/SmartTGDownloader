name: Build and Release Android App

on:
  push:
    branches:
      - android

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse app version
        id: parse_version
        run: |
          VERSION=$(grep 'version: ' android_flutter/pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION | cut -d'+' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Generate version.dart
        run: |
          echo 'const String appVersionName = "${{ env.VERSION_NAME }}";' > android_flutter/lib/version.dart
          echo 'const int appVersionCode = ${{ env.VERSION_CODE }};' >> android_flutter/lib/version.dart

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd android_flutter
          flutter pub get


      - name: Build Split APKs (per ABI)
        run: |
          cd android_flutter
          flutter build apk --release --split-per-abi

      - name: Extract Release Notes
        run: |
          python .github/workflows/extract_changelog.py ${{ env.VERSION_NAME }}

      - name: Create and Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-android
          name: SmartTG Downloader Android v${{ env.VERSION_NAME }}
          body_path: release_notes.txt
          files: |
            android_flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            android_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            android_flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
