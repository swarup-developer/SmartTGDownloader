[project]
name = "smarttgdownloader"
version = "8.9.0"
description = "SmartTG Downloader - Telegram bulk media downloader for Windows"
requires-python = ">=3.13"
dependencies = [
    "cryptography==46.0.3",
    "pyaes==1.6.1",
    "pyasn1==0.6.1",
    "pycparser==2.23",
    "pysocks==1.7.1",
    "rsa==4.9.1",
    "telethon==1.42.0",
    "wxpython==4.2.4",
]

[dependency-groups]
build = [
    "setuptools==80.9.0",
    "pyinstaller==6.18.0",
    "pyinstaller-hooks-contrib==2025.10",
    "altgraph==0.17.5",
    "packaging==25.0",
    "pefile==2024.8.26",
    "pywin32-ctypes==0.2.3",
    "cython==3.1.4",
    "zstandard==0.25.0",
]
